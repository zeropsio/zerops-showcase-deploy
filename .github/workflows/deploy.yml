name: Deploy to Zerops

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    types: [opened, reopened, synchronize, closed]
    branches: [stage]
  delete:

permissions:
  contents: read
  pull-requests: write

env:
  ZEROPS_API_BASE: https://api.app-prg1.zerops.io/api/rest/public
  APP_REPO: zerops-recipe-apps/showcase-recipe-app
  WORKER_REPO: zerops-recipe-apps/showcase-recipe-worker
  APP_SERVICE_NAME: app
  WORKER_SERVICE_NAME: worker
  ZEROPS_YAML_SETUP: prod
  ZEROPS_OWNER_REPOSITORY: ${{ github.repository }}
  ZEROPS_PROTECTED_NAMES: ${{ vars.ZEROPS_PROTECTED_NAMES }}

jobs:
  identity:
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Compute case-sensitive environment lock
        id: key
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          REF: ${{ github.event_name == 'delete' && github.event.ref || github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          source zerops/scripts/zerops-api.sh
          if [[ "$EVENT" == pull_request ]]; then
            if [[ "$ACTION" == closed ]]; then key=stage; else key="pr-$PR_NUMBER"; fi
          elif [[ "$GITHUB_REF" == refs/tags/* || "$REF" == main ]]; then
            key=prod
          else
            key="branch-$(slugify "$REF")"
          fi
          printf 'key=%s\n' "$key" >> "$GITHUB_OUTPUT"

  deploy:
    needs: identity
    # Never run PR-controlled orchestration with deployment credentials, including fork PRs.
    if: >-
      (github.event_name == 'push' && github.ref != 'refs/heads/stage') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
       ((github.event.action == 'closed' && github.event.pull_request.merged == true) ||
        github.event.action != 'closed'))
    runs-on: ubuntu-latest
    concurrency:
      group: zerops-${{ github.repository }}-${{ needs.identity.outputs.key }}
      cancel-in-progress: false
    steps:
      - name: Checkout trusted deployment orchestration
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && (github.event.action == 'closed' && github.event.pull_request.base.ref || github.event.pull_request.base.sha) || github.sha }}
          persist-credentials: false

      - name: Resolve and checkout service code
        id: source
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN || github.token }}
          SOURCE_KIND: ${{ startsWith(github.ref, 'refs/tags/') && 'tag' || 'branch' }}
          SOURCE_REF: ${{ github.event_name == 'pull_request' && (github.event.action == 'closed' && github.event.pull_request.base.ref || github.event.pull_request.head.ref) || github.ref_name }}
        run: |
          set -euo pipefail
          bash zerops/scripts/checkout-source.sh "$APP_REPO" app "$SOURCE_KIND" "$SOURCE_REF" app
          bash zerops/scripts/checkout-source.sh "$WORKER_REPO" worker "$SOURCE_KIND" "$SOURCE_REF" worker

      - name: Deploy environment
        id: deploy
        env:
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
          ZEROPS_CLIENT_ID: ${{ secrets.ZEROPS_CLIENT_ID }}
          ZEROPS_ENV_KIND: ${{ github.event_name == 'pull_request' && (github.event.action == 'closed' && 'stage' || 'pr') || (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && 'prod' || 'branch' }}
          ZEROPS_ENV_REF: ${{ github.event_name == 'pull_request' && (github.event.action == 'closed' && github.event.pull_request.base.ref || github.event.pull_request.number) || (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && 'main' || github.ref_name }}
          APP_SHA: ${{ steps.source.outputs.app_sha }}
          APP_REF: ${{ steps.source.outputs.app_ref }}
          WORKER_SHA: ${{ steps.source.outputs.worker_sha }}
          WORKER_REF: ${{ steps.source.outputs.worker_ref }}
        run: |
          set -euo pipefail
          source zerops/scripts/zerops-api.sh
          case "$ZEROPS_ENV_KIND" in
            branch) PROJECT_NAME="showcase-dev-$(slugify "$ZEROPS_ENV_REF")"; config=dev ;;
            pr) PROJECT_NAME="showcase-mr-$ZEROPS_ENV_REF"; config=stage ;;
            stage) PROJECT_NAME=showcase-stage; config=stage ;;
            prod) PROJECT_NAME=showcase-prod; config=prod ;;
          esac
          zerops_render_template zerops/recipes/zerops-import.yml.tpl "zerops/recipes/env-$config.env" "$PROJECT_NAME"
          zerops_ensure_project "$ZEROPS_CLIENT_ID" "$PROJECT_NAME" "" 300
          zerops_find_service "$PROJECT_ID" "$APP_SERVICE_NAME"
          zerops_deploy_service "$SERVICE_FOUND_ID" ./app ./app/zerops.yaml "$ZEROPS_YAML_SETUP"
          zerops_find_service "$PROJECT_ID" "$WORKER_SERVICE_NAME"
          zerops_deploy_service "$SERVICE_FOUND_ID" ./worker ./worker/zerops.yml "$ZEROPS_YAML_SETUP"
          zerops_find_service "$PROJECT_ID" "$APP_SERVICE_NAME"
          zerops_enable_subdomain "$SERVICE_FOUND_ID"
          zerops_get_subdomain_url "$PROJECT_ID" "$APP_SERVICE_NAME"
          printf 'subdomain_url=%s\n' "$SUBDOMAIN_URL" >> "$GITHUB_OUTPUT"
          {
            printf '### Deployed to Zerops\n\n**Project:** %s\n\n' "$PROJECT_NAME"
            printf '**App:** %s at %s\n\n' "$APP_REF" "$APP_SHA"
            printf '**Worker:** %s at %s\n\n' "$WORKER_REF" "$WORKER_SHA"
            printf '**URL:** %s\n' "$SUBDOMAIN_URL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update PR preview comment
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.subdomain_url }}
          APP_SHA: ${{ steps.source.outputs.app_sha }}
          APP_REF: ${{ steps.source.outputs.app_ref }}
          WORKER_REF: ${{ steps.source.outputs.worker_ref }}
          WORKER_SHA: ${{ steps.source.outputs.worker_sha }}
        with:
          script: |
            const marker = '<!-- zerops-mr-staging -->';
            const body = `${marker}\n### Zerops MR Staging\n\n**Preview URL:** ${process.env.PREVIEW_URL}\n\n**App ref:** \`${process.env.APP_REF}\`\n**App commit:** \`${process.env.APP_SHA}\`\n\n**Worker ref:** \`${process.env.WORKER_REF}\`\n**Worker commit:** \`${process.env.WORKER_SHA}\``;
            const args = {...context.repo, issue_number: context.issue.number};
            const comments = await github.paginate(github.rest.issues.listComments, args);
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({...context.repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({...args, body});
            }

  cleanup-pr:
    needs: deploy
    if: >-
      always() && github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: zerops-${{ github.repository }}-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Delete closed PR preview
        env:
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
          ZEROPS_CLIENT_ID: ${{ secrets.ZEROPS_CLIENT_ID }}
          ZEROPS_ENV_KIND: pr
          ZEROPS_ENV_REF: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          source zerops/scripts/zerops-api.sh
          zerops_delete_project_by_name "$ZEROPS_CLIENT_ID" "showcase-mr-$ZEROPS_ENV_REF"

  cleanup-branch:
    needs: identity
    if: github.event_name == 'delete' && github.event.ref_type == 'branch' && github.event.ref != 'main' && github.event.ref != 'stage'
    runs-on: ubuntu-latest
    concurrency:
      group: zerops-${{ github.repository }}-${{ needs.identity.outputs.key }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Delete removed branch preview
        env:
          ZEROPS_TOKEN: ${{ secrets.ZEROPS_TOKEN }}
          ZEROPS_CLIENT_ID: ${{ secrets.ZEROPS_CLIENT_ID }}
          ZEROPS_ENV_KIND: branch
          ZEROPS_ENV_REF: ${{ github.event.ref }}
        run: |
          set -euo pipefail
          source zerops/scripts/zerops-api.sh
          zerops_delete_project_by_name "$ZEROPS_CLIENT_ID" "showcase-dev-$(slugify "$ZEROPS_ENV_REF")"
